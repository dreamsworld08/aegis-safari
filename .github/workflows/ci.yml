name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check.mjs
  build-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-safari.sh
      - name: Zip app
        run: |
          APP="$(find build/DerivedData -name Aegis.app -type d | head -1)"
          ditto -c -k --keepParent "$APP" Aegis-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-macOS-arm64
          path: Aegis-macOS-arm64.zip
      - name: Publish release for new manifest version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version extension/manifest.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" Aegis-macOS-arm64.zip --target "$GITHUB_SHA" --title "Aegis $TAG" \
            --notes "Apple Silicon build (ad-hoc signed). Install: unzip, move Aegis.app to Applications, run xattr -dr com.apple.quarantine /Applications/Aegis.app, open it once, restart Safari."
