name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/check.mjs
  build-macos:
    runs-on: macos-15
    env:
      HAS_CERT: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/build-safari.sh
      - name: Sign with Apple Development certificate
        if: env.HAS_CERT == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/sign-ci.sh "$(find build/DerivedData -name Aegis.app -type d | head -1)"
      - name: Note unsigned build
        if: env.HAS_CERT != 'true'
        run: echo "::notice::No signing certificate secret set; release is ad-hoc signed."
      - name: Zip app
        run: |
          APP="$(find build/DerivedData -name Aegis.app -type d | head -1)"
          ditto -c -k --keepParent "$APP" Aegis-macOS-arm64.zip
          shasum -a 256 Aegis-macOS-arm64.zip | awk '{print $1}' > Aegis-macOS-arm64.zip.sha256
          echo "--- app entitlements"; codesign -d --entitlements - "$APP" || true
          echo "--- extension entitlements"; codesign -d --entitlements - "$APP"/Contents/PlugIns/*.appex || true
          ls "$APP"/Contents/PlugIns/*.appex/Contents/Resources/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-macOS-arm64
          path: |
            Aegis-macOS-arm64.zip
            Aegis-macOS-arm64.zip.sha256
      - name: Publish release for new manifest version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(jq -r .version extension/manifest.json)"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG already released"; exit 0; fi
          gh release create "$TAG" Aegis-macOS-arm64.zip Aegis-macOS-arm64.zip.sha256 --target "$GITHUB_SHA" --title "Aegis $TAG" \
            --notes "Apple Silicon build (ad-hoc signed). Install: unzip, move Aegis.app to Applications, run xattr -dr com.apple.quarantine /Applications/Aegis.app, open it once, restart Safari. From v0.3.0 on, updates install in-app."
