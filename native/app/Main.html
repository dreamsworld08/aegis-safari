<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'">
  <title>Aegis</title>
  <link rel="stylesheet" href="__ASSETS__Style.css">
  <script src="__ASSETS__Script.js" defer></script>
</head>
<body>
  <h1>Aegis</h1>
  <div class="muted">Version <span id="version">…</span></div>
  <p id="state">Checking extension status…</p>
  <button id="prefs">Open Safari Extensions Settings…</button>

  <div class="card">
    <strong>Updates</strong>
    <p id="upd">Checking for updates…</p>
    <p id="err"></p>
    <button id="check">Check for updates</button>
    <button id="install" hidden>Install update</button>
  </div>
</body>
</html>
